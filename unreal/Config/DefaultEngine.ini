[/Script/EngineSettings.GameMapsSettings]
; The game builds its apartment at runtime, so it runs in any map. Content/Python/init_unreal.py
; creates /Game/Maps/NightOne (with the set placed, for editing) the first time the editor opens.
EditorStartupMap=/Game/Maps/NightOne
GameDefaultMap=/Game/Maps/NightOne
GlobalDefaultGameMode=/Script/ShortStack.NightOneGameMode

[/Script/Engine.RendererSettings]
; Lumen global illumination and reflections, virtual shadow maps, Nanite, temporal super resolution.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.Lumen.TraceMeshSDFs=1
r.SkinCache.CompileShaders=True
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
; Hardware ray tracing (RTX-class GPUs): Lumen traces the real triangles instead of distance fields,
; for exact neon and screen light bouncing around the room and sharp reflections. Settings > Graphics >
; Ray-traced lighting switches it at runtime (r.Lumen.HardwareRayTracing); the Cinematic preset adds
; hit lighting for reflections. Changing r.RayTracing recompiles shaders on the next editor launch.
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=0
; Lumen reflections on translucent surfaces: the rain-streaked window glass.
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DirectX 12 with Shader Model 6: required for hardware ray tracing and Nanite.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

